openapi: 3.2.0
info:
  title: Swell Frontend Store API
  version: 2025-01
  description: Swell Frontend API — the client-safe, public-key-authenticated REST surface used from storefronts, single-page apps, and headless commerce experiences.
  contact:
    name: Swell Developer Support
    url: https://developers.swell.is/frontend-api/introduction
  license:
    name: API Profile — API Evangelist
    url: https://apievangelist.com
servers:
- url: https://{storeId}.swell.store
  description: Per-store Frontend API endpoint
  variables:
    storeId:
      default: my-store
      description: Your Swell store ID (subdomain).
security:
- SwellPublicKey: []
tags:
- name: Store
  description: Public store settings, currencies, payment settings, and menus.
paths:
  /api/settings:
    get:
      tags:
      - Store
      summary: Retrieve Store Settings
      operationId: frontendGetSettings
      responses:
        '200':
          description: Public store settings (currency
          locale: null
          store name).: null
  /api/settings/payments:
    get:
      tags:
      - Store
      summary: Retrieve Payment Settings
      operationId: frontendGetPaymentSettings
      responses:
        '200':
          description: Public payment gateway configuration.
  /api/settings/currencies:
    get:
      tags:
      - Store
      summary: List Supported Currencies
      operationId: frontendListCurrencies
      responses:
        '200':
          description: Currencies and exchange rates.
components:
  securitySchemes:
    SwellPublicKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Public storefront key, prefixed with `pk_`. Pass as `Authorization: pk_...`.'
