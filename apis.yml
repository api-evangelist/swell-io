apis:
- aid: swell-io:swell-graphql-api
  name: Swell GraphQL API
  tags:
  - Commerce
  - GraphQL
  - Storefront
  - Experimental
  humanURL: https://developers.swell.is/frontend-api/frontend-libraries/graphql
  baseURL: https://{store-id}.swell.store/graphql/v2
  properties:
  - url: https://developers.swell.is/frontend-api/frontend-libraries/graphql
    type: Documentation
  - url: https://{store-id}.swell.store/playground
    type: APIReference
    name: GraphQL Playground
  - url: graphql/swell-io-graphql.md
    type: GraphQL
  description: >-
    Experimental (alpha) GraphQL endpoint that exposes a curated subset of the storefront commerce model
    — products, attributes, categories, accounts, sessions, carts, orders, payments, payment settings,
    subscriptions, store settings, currencies, and navigation menus. Authorized with a public storefront
    key passed in the Authorization header. Notable limits: no nested queries, no payment tokenization,
    no abandoned-cart recovery, no guest cart email updates. A GraphQL playground is available at /playground
    when logged into the dashboard.
- aid: swell-io:swell-webhooks-api
  name: Swell Webhooks
  tags:
  - Commerce
  - Eventing
  - Webhook
  tags_raw:
  - Commerce
  - Eventing
  - Webhooks
  humanURL: https://developers.swell.is/backend-api/webhooks
  properties:
  - url: https://developers.swell.is/backend-api/webhooks
    type: Documentation
  - url: examples/swell-webhook-event-example.json
    type: Examples
  description: >-
    Event-driven HTTP callbacks for cart, order, subscription, payment, account, and product lifecycle
    events. Configurable via the dashboard (Developer → Webhooks) or programmatically through the Backend
    API and Swell Apps. Payloads are JSON POSTs with `id`, `date_created`, `model`, `type`, and `data`.
    Endpoints must return 2xx; failed deliveries retry hourly for two days, continue hourly after, and
    auto-disable after three days. Webhooks originate from the documented Swell IP allowlist (52.52.111.237,
    54.219.85.17, 54.241.235.166, plus 216.218.185.0/27, 216.218.244.192/27, 74.80.234.0/24).
- aid: swell-io:swell-apps-platform
  name: Swell Apps Platform
  tags:
  - Application
  - Extensions
  - Functions
  - Edge
  tags_raw:
  - Apps
  - Extensions
  - Functions
  - Edge
  humanURL: https://developers.swell.is/apps/overview
  properties:
  - url: https://developers.swell.is/apps/overview
    type: Documentation
  - url: https://github.com/swellstores/apps-sdk
    type: SDKs
    name: Swell Apps SDK
  - url: https://github.com/swellstores/app-types
    type: SDKs
    name: Swell Apps TypeScript Bindings
  description: >-
    Swell Apps extend the platform with custom data models (added fields or new entities), events (triggering
    functions, webhooks, and notifications), edge functions deployed to 200+ locations with no cold start,
    and admin UI surfaces (settings, content views). Apps are distributed via a swell.json manifest and
    built with the Swell CLI and Apps SDK; TypeScript bindings are published in the app-types package.
    Used for first-party integrations (Contentful, Builder.io, honest reviews) and third-party merchant
    extensions.
